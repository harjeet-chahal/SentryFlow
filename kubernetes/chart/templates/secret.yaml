{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentryflow.fullname" . }}-secrets
  labels:
    {{- include "sentryflow.labels" . | nindent 4 }}
  annotations:
    # Keep the generated JWT secret stable across upgrades. Regenerating it
    # would invalidate every issued token on every `helm upgrade`.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" (include "sentryflow.fullname" .)) }}
  {{- if .Values.secrets.jwtSecret }}
  jwtSecret: {{ .Values.secrets.jwtSecret | quote }}
  {{- else if $existing }}
  jwtSecret: {{ index $existing.data "jwtSecret" | b64dec | quote }}
  {{- else }}
  jwtSecret: {{ randAlphaNum 64 | quote }}
  {{- end }}
  postgresUser: {{ .Values.secrets.postgresUser | quote }}
  postgresPassword: {{ required "secrets.postgresPassword is required" .Values.secrets.postgresPassword | quote }}
  clickhouseUser: {{ .Values.secrets.clickhouseUser | quote }}
  clickhousePassword: {{ .Values.secrets.clickhousePassword | quote }}
{{- end }}
