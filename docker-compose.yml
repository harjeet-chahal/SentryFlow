# Local development stack: the gateway, dashboard and analytics pipeline
# with every dependency, using development-only credentials. For production
# see docs/deployment.md.
#
#   docker compose up -d --build
#   docker compose logs migrate      # the generated admin password, unless
#                                    # SENTRYFLOW_ADMIN_PASSWORD was set
#
# Host ports can be moved if something else holds them, e.g.
#   BACKEND_PORT=8001 DASHBOARD_PORT=8081 docker compose up -d

x-backend-env: &backend-env
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sentryflow
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "9000"
  CLICKHOUSE_USER: sentryflow
  CLICKHOUSE_PASSWORD: sentryflow
  CLICKHOUSE_DATABASE: sentryflow
  JWT_SECRET: local-development-only-change-me
  CORS_ORIGINS: http://localhost,http://localhost:${DASHBOARD_PORT:-80},http://localhost:3000

services:
  # API gateway: auth, rate limiting, usage events, dashboard APIs
  backend:
    build: ./backend
    image: sentryflow-backend:dev
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      # Not required: the gateway connects to Kafka whenever it arrives.
      # Waiting keeps the start-up log free of connection retries.
      kafka:
        condition: service_healthy
    environment: *backend-env
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  # One-shot: create or upgrade the Postgres schema and seed the admin user.
  migrate:
    build: ./backend
    image: sentryflow-backend:dev
    command: ["python", "-m", "backend.setup_db"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *backend-env
      SENTRYFLOW_ADMIN_PASSWORD: ${SENTRYFLOW_ADMIN_PASSWORD:-}

  # Dashboard. nginx serves the build and proxies the API paths, so the
  # browser talks to one origin.
  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${DASHBOARD_PORT:-80}:8080"

  # Kafka -> ClickHouse ingestion
  aggregator:
    build: ./aggregator
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_USER: sentryflow
      CLICKHOUSE_PASSWORD: sentryflow
      CLICKHOUSE_DATABASE: sentryflow
      FLUSH_INTERVAL_SECONDS: "2"

  postgres:
    image: postgres:13
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sentryflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "sentryflow"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:6
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # Single-node Kafka in KRaft mode (no ZooKeeper). Containers use
  # kafka:19092; tools on the host use localhost:9092.
  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: sentryflow
      CLICKHOUSE_USER: sentryflow
      CLICKHOUSE_PASSWORD: sentryflow
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Optional: docker compose --profile tools up -d kafka-ui
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: ["tools"]
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: sentryflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"

  # Load test (k6), run inside this network so it measures the gateway and
  # not Docker Desktop's port forwarding. See docs/load-testing.md.
  #   SENTRYFLOW_ADMIN_PASSWORD=... docker compose --profile loadtest run --rm loadtest
  loadtest:
    image: grafana/k6:1.0.0
    profiles: ["loadtest"]
    depends_on:
      - backend
    volumes:
      - ./loadtest:/scripts
    environment:
      BASE_URL: http://backend:8000
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${SENTRYFLOW_ADMIN_PASSWORD:-}
      RATE: ${LOADTEST_RATE:-200}
      DURATION: ${LOADTEST_DURATION:-60s}
      ALGORITHM: ${LOADTEST_ALGORITHM:-sliding_window}
    command: ["run", "--summary-export", "/scripts/results/summary.json", "/scripts/gateway.js"]

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  clickhouse-data:
